# config/robots/aka01b-common.yaml
# AKA-01B系列机器人共有配置（所有开发板共享）
# 开发板独有配置（HARDWARE.MODE, MODEL_FORMAT, ARM.PORT, VISION.MODEL_NAME）
# 见各 <board>.yaml 文件

HARDWARE:
  BASE:
    TYPE: "differential"
    DRIVER: "d24a_jgb37"
    WHEEL_RADIUS: 0.042
    WHEEL_BASE: 0.195

    CONTROL:
      KP_DIST: 0.8
      KP_ANGLE: 0.005
      KI: 0.5
      KD: 0.1
      MAX_LINEAR_SPEED: 0.4
      MAX_ANGULAR_SPEED: 1.0
      SEARCH_ROTATION_SPEED: 0.3

    DRIVER:
      TYPE: "d24a_jgb37"
      KP: 1.8
      KI: 0.004
      KD: 0.002

    MOTORS:
      - name: "front_left"
        in2: 36
        in1: 39
        phase_A: 40
        phase_B: 42
        pwm_chip: 0
        pwm_channel: 0
        direction_forward: -1
      - name: "front_right"
        in2: 47
        in1: 63
        phase_A: 96
        phase_B: 114
        pwm_chip: 1
        pwm_channel: 0
        direction_forward: 1
      - name: "back_left"
        in2: 34
        in1: 44
        phase_A: 45
        phase_B: 46
        pwm_chip: 5
        pwm_channel: 0
        direction_forward: -1
      - name: "back_right"
        in2: 35
        in1: 101
        phase_A: 100
        phase_B: 99
        pwm_chip: 4
        pwm_channel: 0
        direction_forward: 1

  CAMERA:
    TYPE: "usb"
    DEVICE_ID: 0
    RESOLUTION: [640, 480]
    FRAME_RATE: 30

  ARM:
    TYPE: "so101"
    USE_DEGREES: false
    DISABLE_TORQUE_ON_DISCONNECT: true
    MAX_RELATIVE_TARGET: 5.0

# 视觉参数（共有部分）
VISION:
  CONFIDENCE_THRESHOLD: 0.5
  NMS_THRESHOLD: 0.45
  INPUT_SIZE: 640
  TENNIS_WIDTH_FAR: 20
  TENNIS_WIDTH_NEAR: 150

# 设备特定参数
PARAMETERS:
  FRAME_WIDTH: 640