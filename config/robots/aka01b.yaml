# config/robots/aka01b.yaml
# AKA-01B机器人特定配置

# 硬件配置
HARDWARE:
  MODE: "rk3588"
  MODEL_FORMAT: "rknn"
  
  BASE:
    TYPE: "differential"
    DRIVER: "d24a_jgb37"
    WHEEL_RADIUS: 0.042
    WHEEL_BASE: 0.195
    MAX_LINEAR_SPEED: 0.4
    MAX_ANGULAR_SPEED: 1.0
    
    MOTORS:
      - name: "front_left"
        in2: 36
        in1: 39
        phase_A: 40
        phase_B: 42
        pwm_chip: 0
        pwm_channel: 0
        direction_inverted: true
      - name: "front_right"
        in2: 47
        in1: 63
        phase_A: 96
        phase_B: 114
        pwm_chip: 1
        pwm_channel: 0
        direction_inverted: false
      - name: "back_left"
        in2: 34
        in1: 44
        phase_A: 45
        phase_B: 46
        pwm_chip: 5
        pwm_channel: 0
        direction_inverted: true
      - name: "back_right"
        in2: 35
        in1: 101
        phase_A: 100
        phase_B: 99
        pwm_chip: 4
        pwm_channel: 0
        direction_inverted: false
    
    PID:
      KP: 1.8
      KI: 0.004
      KD: 0.002

  CAMERA:
    TYPE: "usb"
    DEVICE_ID: 0
    RESOLUTION: [640, 480]
    FRAME_RATE: 30

  ARM:
    TYPE: "so101"
    PORT: "/dev/ttyUSB0"
    USE_DEGREES: false
    DISABLE_TORQUE_ON_DISCONNECT: true
    MAX_RELATIVE_TARGET: 5.0

# 视觉参数
VISION:
  MODEL_NAME: "yolov8n-fp16-tennis.rknn"
  CONFIDENCE_THRESHOLD: 0.5
  NMS_THRESHOLD: 0.45
  INPUT_SIZE: 640
  TENNIS_WIDTH_FAR: 20
  TENNIS_WIDTH_NEAR: 150

# 设备特定参数
PARAMETERS:
  FRAME_WIDTH: 640