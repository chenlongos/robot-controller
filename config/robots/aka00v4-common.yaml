# config/robots/aka00v4-common.yaml
# AKA-00V4系列机器人共有配置（所有开发板共享）
# 开发板独有配置（HARDWARE.MODE, MODEL_FORMAT, BASE.PORT, ARM.PORT, VISION.MODEL_NAME）
# 见各 <board>.yaml 文件

HARDWARE:
  BASE:
    TYPE: "differential"
    WHEEL_RADIUS: 0.03
    WHEEL_BASE: 0.18
    BAUDRATE: 115200

    CONTROL:
      KP_DIST: 1.5
      KP_ANGLE: 1.0
      KI: 0.01
      KD: 0.01
      MAX_LINEAR_SPEED: 0.4
      MAX_ANGULAR_SPEED: 3
      SEARCH_ROTATION_SPEED: 1.5

    DRIVER:
      TYPE: "esp32_c3_tt"
      KP: 0.5
      KI: 0.01
      KD: 0.0
      MAX_RATE: 5
      MIN_PWM: 20
      MAX_PWM: 60
      LINEAR_K: 2        # 线速度补偿值，根据实际情况调整
      ROTATION_K: 4      # 旋转速度补偿值，根据实际情况调整

  CAMERA:
    TYPE: "usb"
    DEVICE_ID: 0
    RESOLUTION: [640, 480]
    FRAME_RATE: 30

  ARM:
    TYPE: "zp10s"
    BAUDRATE: 115200

# 视觉参数（共有部分）
VISION:
  CONFIDENCE_THRESHOLD: 0.5
  NMS_THRESHOLD: 0.45
  INPUT_SIZE: 640
  TENNIS_WIDTH_FAR: 20
  TENNIS_WIDTH_NEAR: 150

# 状态机参数（共有部分）
STATEMACHINE:
  TARGET_X: 60.0
  TARGET_DISTANCE: 0.12
  THRESHOLD_X: 10.0
  THRESHOLD_D: 0.01
  GRIP_THRESHOLD: 10
  REACH_COUNT_THRESHOLD: 10
  BUCKET_EDGE_THRESHOLD: 5

# 设备特定参数
PARAMETERS:
  FRAME_WIDTH: 640