# config/common.yaml
# 通用配置文件 - 所有机器人共享的基础配置

# 系统配置
SYSTEM:
  ROBOT_ID: "aka01b"
  LOG_LEVEL: "INFO"
  DEBUG_MODE: false
  HARDWARE_TIMEOUT: 5.0
  MAX_RETRIES: 3

# 任务配置
TASK:
  SEARCH_TIMEOUT: 30
  PICK_RETRY_COUNT: 3
  PLACE_RETRY_COUNT: 2
  BUCKET_APPROACH_DISTANCE: 0.2
  MAX_OBJECTS_PER_TASK: 10

# 通信配置
COMMUNICATION:
  MQTT_BROKER: "localhost"
  MQTT_PORT: 1883
  MQTT_TOPIC_PREFIX: "robot/"
  HEARTBEAT_INTERVAL: 10

# 控制参数
CONTROL:
  KP_DIST: 0.8
  KP_ANGLE: 0.5
  WHEEL_BASE: 0.2
  MAX_SPEED: 100
  MIN_SPEED_RATIO: 30
  IDLE_SPEED: 20

# 视觉参数
VISION:
  MODEL_NAME: "best.rknn"
  CONFIDENCE_THRESHOLD: 0.5
  NMS_THRESHOLD: 0.45
  INPUT_SIZE: 640
  TENNIS_WIDTH_FAR: 20
  TENNIS_WIDTH_NEAR: 150