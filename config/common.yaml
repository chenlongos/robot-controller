# config/common.yaml
# 通用配置文件 - 所有机器人共享的基础配置

# 系统配置
SYSTEM:
  ROBOT_ID: "aka00v4-rk3576"
  LOG_LEVEL: "INFO"
  DEBUG_MODE: false
  HARDWARE_TIMEOUT: 5.0
  MAX_RETRIES: 3
  DISPLAY_ENABLED: false
  DISPLAY_INTERVAL: 5

# 任务配置
TASK:
  SEARCH_TIMEOUT: 30
  PICK_RETRY_COUNT: 3
  PLACE_RETRY_COUNT: 2
  BUCKET_APPROACH_DISTANCE: 0.2
  MAX_OBJECTS_PER_TASK: 10

# 通信配置
COMMUNICATION:
  MQTT_BROKER: "localhost"
  MQTT_PORT: 1883
  MQTT_TOPIC_PREFIX: "robot/"
  HEARTBEAT_INTERVAL: 10

# 控制参数
CONTROL:
  KP_DIST: 0.8
  KP_ANGLE: 0.5
  WHEEL_BASE: 0.2
  MAX_SPEED: 100
  MIN_SPEED_RATIO: 30
  IDLE_SPEED: 20
  SEARCH_ROTATION_SPEED: 0.3